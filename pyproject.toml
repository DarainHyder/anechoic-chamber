[project]
name = "anechoic-chamber"
version = "0.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["kaggle/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["api", "eval", "ml", "scripts", "synth", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["scipy.*", "soundfile", "pyloudnorm", "pyloudnorm.*", "panns_inference", "panns_inference.*"]
ignore_missing_imports = true
